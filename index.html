<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jayena – Registro de Bebidas (viernes)</title>
  <meta name="theme-color" content="#0ea5e9" />
  <style>
    :root{
      --bg:#f7f7fb; --panel:#ffffff; --muted:#6b7280; --text:#111827; --accent:#0ea5e9; --accent-2:#38bdf8; --ok:#10b981; --danger:#ef4444; --shadow:0 10px 30px rgba(0,0,0,.08); --radius:18px;
    }
    @media (prefers-color-scheme: dark) {
      :root{
        --bg:#111827; --panel:#1f2937; --muted:#9ca3af; --text:#f9fafb; --accent:#38bdf8; --accent-2:#0ea5e9; --ok:#34d399; --danger:#f87171; --shadow:0 10px 30px rgba(0,0,0,.6);
      }
      body{background:radial-gradient(1200px 800px at 70% -20%, #0f172a 0%, transparent 60%),radial-gradient(900px 700px at -10% 10%, #1e293b 0%, transparent 55%),var(--bg);} 
      .card{background:linear-gradient(180deg,var(--panel),rgba(31,41,55,.98)); border:1px solid rgba(255,255,255,.1)}
      .drink{background:var(--panel)}
      .round{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15)}
      .total-line{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15)}
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;background:radial-gradient(1200px 800px at 70% -20%,#dff5ff 0%,transparent 60%),radial-gradient(900px 700px at -10% 10%,#f3f7ff 0%,transparent 55%),var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:clamp(12px,3vw,24px)}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
    .title{display:flex;align-items:center;gap:10px}
    .title h1{font-size:clamp(18px,4.5vw,28px);margin:0}
    .pill{background:rgba(56,189,248,.12);border:1px dashed rgba(56,189,248,.5);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--accent)}
    .card{background:linear-gradient(180deg,#fff,rgba(255,255,255,.98));border:1px solid rgba(17,24,39,.08);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
    .grid{display:grid;gap:12px}
    @media(min-width:720px){.grid.cols-2{grid-template-columns:1fr 1fr}}
    .section-title{font-weight:700;margin:8px 0 10px 2px;opacity:.9}
    .row{display:flex;align-items:center;gap:10px}
    .row.wrap{flex-wrap:wrap}
    label{font-size:14px;color:var(--muted)}
    select{background:#fff;color:var(--text);border:1px solid rgba(17,24,39,.12);padding:10px 12px;border-radius:12px;outline:none;font-size:14px;box-shadow:inset 0 1px 0 rgba(0,0,0,.02)}
    button{border:0;cursor:pointer}
    .btn{background:rgba(148,163,184,.12);color:var(--text);padding:10px 12px;border-radius:12px;font-weight:600}
    .btn:hover{background:rgba(148,163,184,.18)}
    .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#00131a}
    .btn-primary:hover{filter:brightness(1.05)}
    .btn-ghost{background:transparent;border:1px dashed rgba(148,163,184,.35)}
    .drinks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:560px){.drinks{grid-template-columns:repeat(3,1fr)}}
    .drink{background:#fff;border:1px solid rgba(17,24,39,.08);border-radius:16px;padding:10px;display:grid;gap:8px}
    .drink h3{margin:0;font-size:16px}
    .muted{color:var(--muted);font-size:12px}
    .qty{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .qty input{width:56px;text-align:center;padding:8px 6px;border-radius:10px;background:#fff;border:1px solid rgba(17,24,39,.18);color:var(--text);font-weight:700}
    .btn-circle{width:40px;height:40px;border-radius:12px;font-size:22px;display:grid;place-items:center;background:#f3f4f6;border:1px solid rgba(17,24,39,.12)}
    .btn-circle:hover{background:#e5e7eb}
    .rounds{display:flex;flex-direction:column;gap:8px}
    .round{display:flex;justify-content:space-between;align-items:center;background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.2);padding:10px;border-radius:12px}
    .round small{color:var(--muted)}
    .totals{display:grid;gap:8px}
    .total-line{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:12px;background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.2)}
    footer{opacity:.7;font-size:12px;margin-top:18px;text-align:center}
    a{color:var(--accent)}
    .banner{margin:10px 0;padding:10px;border-radius:12px;border:1px solid rgba(239,68,68,.3);background:#fff0f0;color:#7f1d1d;display:none}
  </style>
</head>
<body>
  <!-- resto del código igual que antes -->
</body>
</html>
